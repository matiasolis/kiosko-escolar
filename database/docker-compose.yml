services:
  postgres:
    image: postgres:16-alpine
    container_name: kiosco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiosco
      POSTGRES_PASSWORD: kiosco123
      POSTGRES_DB: kiosco
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: